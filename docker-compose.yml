# Local development and E2E services.
#   npm run db:up                         -> Postgres only (for `npm run dev:api`)
#   docker compose --profile app up -d    -> Postgres + the API container (E2E against the real image)
services:
  postgres:
    image: postgres:17-alpine
    container_name: dunialab-postgres
    environment:
      POSTGRES_USER: dunialab
      POSTGRES_PASSWORD: dunialab
      POSTGRES_DB: dunialab
    ports:
      - "127.0.0.1:5433:5432"  # loopback only: fixed dev credentials
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dunialab"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: dunialab-api:local
    container_name: dunialab-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://dunialab:dunialab@postgres:5432/dunialab
      JWT_SECRET: local-docker-secret-not-for-real-use-0123456789
      # Draft packs are never served in production mode; for local E2E we serve the draft explicitly.
      ALLOW_DRAFT_CONTENT: "true"
      # ANTHROPIC_API_KEY: set in your shell to exercise the real AI grader
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Unused unless this is "true" (founder decision D3; findings register CR96)
      EXTERNAL_AI_APPROVED: ${EXTERNAL_AI_APPROVED:-false}
    ports:
      - "127.0.0.1:3000:3000"  # loopback only

volumes:
  pgdata:
