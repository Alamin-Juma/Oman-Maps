# CI enforces the Feature -> Unit -> E2E rule (docs/engineering/testing-workflow.md).
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

# Least privilege: these jobs only read the repo (PR #1 review).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, feature + unit tests, content validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate:content
      # Vitest runs the root tests without checking their types (findings register T4).
      - run: npm run typecheck:tests
      - run: npm test

  csharp-core:
    name: C# core (mastery conformance, tiers) with dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test apps/unity/Core.Tests

  e2e:
    name: E2E (built API + Postgres + browser)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dunialab
          POSTGRES_PASSWORD: dunialab
          POSTGRES_DB: dunialab
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U dunialab" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://dunialab:dunialab@localhost:5433/dunialab
      # A missing database must FAIL the run here, never skip it (findings register T1).
      E2E_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker:
    # Builds the API image AND runs it: the API end-to-end tests run against the container in
    # production mode (findings register T5). Building alone proved nothing about startup,
    # migrations or configuration.
    name: API Docker image builds and passes the API E2E tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build and start the image with Postgres
        run: docker compose --profile app up -d --build
      - name: Wait until the API is healthy
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/health && exit 0
            sleep 2
          done
          docker compose --profile app logs api
          exit 1
      - run: npm ci
      - run: npm run build
      - name: API E2E against the running image
        env:
          E2E_API_URL: http://localhost:3000
          E2E_REQUIRE_DB: "1"
        run: node scripts/vitest.mjs run --project e2e tests/e2e/api
      - name: Container logs on failure
        if: failure()
        run: docker compose --profile app logs api
      - name: Stop the containers
        if: always()
        run: docker compose --profile app down -v
